name: Docs

on:
  push:
    branches: ["main"]
    # Scoped to what the build actually reads: a push that only touches a
    # planning document at the repo root should not cost a full site build.
    paths:
      - 'lectures/**'
      - 'docs/**'
      - 'docs-book/**'
      - 'media/**'
      - 'pdf/**'
      - 'tikz/**.tex'
      # Figure descriptions for the text edition, read by py/figtext.py
      - 'tikz/desc/**'
      - 'py/**'
      - 'ex/**'
      - 'examples/**'
      - 'slides/**'
      - 'jupyter/**'
      - 'Makefile'
      - 'requirements-ci.txt'
      - 'syllabus.md'
      - 'plan.md'
      - 'downloads.md'
      - 'version'
      - '.github/workflows/matrix_build.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Which site to publish: 'book' is the just-the-docs site assembled
  # from docs-book/ by py/mkbooksite.py; 'legacy' is the old minima site
  # in docs/. Flip this one line to roll back.
  SITE_FLAVOR: book

# All build jobs run in the repo's own image (see docker.yaml): TeX Live 2022
# plus every apt and pip dependency preinstalled. Before this, each job
# pulled texlive/texlive from docker.io and re-ran apt-get install, which was
# about half the runner-minutes of a run.

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wulffern/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Cache keyed on the figure inputs, same scheme as the standalone
      # shards: restore the exact or newest snapshot, save only when the
      # inputs changed. Hits are decided per figure inside py/tikzcache.py
      # on a content hash, so the key only decides when to save. It is
      # computed once here, before the build writes into media/.
      - name: TikZ cache key
        id: tikzkey
        shell: bash
        run: echo "key=tikz-figures-${{ hashFiles('tikz/**', 'cictikz/**', 'py/tikzcache.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore TikZ figure cache
        id: tikzcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/aic-tikz
          key: ${{ steps.tikzkey.outputs.key }}
          restore-keys: |
            tikz-figures-

      # The generated figures are not committed; build them before
      # prepare-docs copies media/ into .build/media and docs/assets/media.
      - name: Build TikZ figures
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make tikz-cached

      - name: Save TikZ figure cache
        uses: actions/cache/save@v6
        if: always() && steps.tikzcache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/aic-tikz
          key: ${{ steps.tikzkey.outputs.key }}

      - name: Prepare shared sources
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make prepare-docs

      - name: Upload prepared sources
        uses: actions/upload-artifact@v7
        with:
          name: prepared-sources
          path: |
            docs/_posts
            docs/assets/media
            docs/assets/html
            docs/assets/examples
            media/*_tikz.*
            media/*/*_tikz.*
            docs/downloads.md
            docs/plan.md
            docs/syllabus.md
            .build
            !.build/*.aux
            !.build/*.log
            !.build/*.pdf
            !.build/*.epub
            !.build/*.bbl
            !.build/*.blg
            !.build/*.toc
            !.build/*.bcf
            !.build/*.xml
            !.build/*.mw
            version
          # .build is a dotdir, which upload-artifact skips by default
          include-hidden-files: true
          if-no-files-found: error

  plan_matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate shard matrix from Makefile
        id: shards
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import math
          import subprocess

          files = [line.strip() for line in subprocess.check_output(["make", "print-files"], text=True).splitlines() if line.strip()]
          shard_count = 4
          shard_size = math.ceil(len(files) / shard_count)
          shards = []
          for idx in range(shard_count):
            group = files[idx * shard_size:(idx + 1) * shard_size]
            if not group:
              continue
            shards.append({
              "shard": f"core-{idx + 1}",
              "files": " ".join(group),
            })
          print(f"shards={json.dumps(shards)}")
          PY

  standalone:
    needs:
      - prepare
      - plan_matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wulffern/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan_matrix.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-sources
          path: .

      # Cache keyed on the chapter inputs: restore the exact or newest
      # snapshot for this shard, save only when the inputs changed. Hits
      # are decided per chapter inside py/pdfcache.py on a content hash,
      # so the key only decides when to save. Computed once, before the
      # build writes into media/.
      - name: Standalone cache key
        id: pdfkey
        shell: bash
        run: echo "key=standalone-pdf-${{ matrix.shard }}-${{ hashFiles('lectures/**', 'media/**', 'tikz/**', 'cictikz/**', 'pdf/**', 'py/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore standalone PDF cache
        id: pdfcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/aic-standalone
          key: ${{ steps.pdfkey.outputs.key }}
          restore-keys: |
            standalone-pdf-${{ matrix.shard }}-

      - name: Build standalone shard
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make standalone-cached FILES="${{ matrix.files }}"

      - name: Save standalone PDF cache
        uses: actions/cache/save@v6
        if: always() && steps.pdfcache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/aic-standalone
          key: ${{ steps.pdfkey.outputs.key }}

      - name: Package standalone shard
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          for f in ${{ matrix.files }}; do
            cp "docs/assets/${f}.pdf" artifact/docs/assets/
          done

      - name: Upload standalone shard
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.shard }}
          path: artifact/docs/assets
          if-no-files-found: error

  # PDF and EPUB in one job: the EPUB is 11s of pandoc, not worth its own
  # container spin-up.
  book:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wulffern/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-sources
          path: .

      - name: Build book PDF and EPUB
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make book-pdf book-epub

      - name: Package book
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          cp docs/assets/aic.pdf docs/assets/aic.epub docs/assets/aic_ai.pdf artifact/docs/assets/

      - name: Upload book
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: artifact/docs/assets
          if-no-files-found: error

  # Marp decks of the Makefile's lectures: a PDF per lecture and an HTML
  # deck to present from. No TeX needed - the TikZ figures came in the
  # prepared sources - but marp-cli needs Node and Chrome, which the
  # plain runner has and the TeX image does not.
  marp:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-sources
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install marp-cli
        run: |
          npm install -g @marp-team/marp-cli@4.5.1
          pip install click
          sudo apt-get install -y --no-install-recommends poppler-utils
          # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Marp decks
        run: make marp

      - name: Upload Marp decks
        uses: actions/upload-artifact@v7
        with:
          name: marp
          path: docs/assets/marp

  jekyll_preview:
    needs:
      - prepare
      - standalone
      - book
      - marp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-sources
          path: .

      - name: Download standalone PDFs
        uses: actions/download-artifact@v8
        with:
          pattern: standalone-*
          merge-multiple: true
          path: docs/assets

      - name: Download book
        uses: actions/download-artifact@v8
        with:
          name: book
          path: docs/assets

      - name: Download Marp decks
        uses: actions/download-artifact@v8
        with:
          name: marp
          path: docs/assets/marp

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---- book site (just-the-docs), theme pinned by Gemfile.lock ----
      - name: Generate book site sources
        if: env.SITE_FLAVOR == 'book'
        run: python3 py/mkbooksite.py

      # The text edition: llms.txt, llms-full.txt and txt/<id>.md, built
      # from the .build/*.llm.md that came over in prepared-sources. None
      # has front matter, so Jekyll copies all of it through untouched.
      - name: Generate text edition
        if: env.SITE_FLAVOR == 'book'
        run: python3 py/mkllms.py

      - name: Setup Ruby
        if: env.SITE_FLAVOR == 'book'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs-book

      - name: Build with Jekyll (book)
        if: env.SITE_FLAVOR == 'book'
        working-directory: docs-book
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build -d ../_site

      # ---- legacy site (minima in docs/), kept for easy rollback ----
      - name: Build with Jekyll (legacy)
        if: env.SITE_FLAVOR == 'legacy'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: jekyll_preview
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
